- key: doe_staff_finance_2022
  publisher: DoE
  release_year: 2022
  url: https://www.education.gov.au/download/17857/finance-2022-financial-reports-higher-education-providers/37442/2022-higher-education-providers-finance-tables/xlsx
  source_page: https://www.education.gov.au/higher-education-statistics/staff-data
  raw_path: data/raw/doe/doe_finance_2022.xlsx
  retrieved_date: '2026-08-30'
  verified: true
  staff_fte_raw_path: data/raw/doe/doe_staff_fte_2022.xlsx
  staff_fte_url: https://www.education.gov.au/download/17047/2022-staff-appendix-1-actual-staff-fte/34801/document/xlsx
  note: '''doe_staff_finance'' is a fixture-era invention -- DoE does not publish
    a single table with staff FTE and finance together. url/raw_path point to the
    real Finance Tables workbook (sheets: Financial Performance, Financial Perf -
    Dual Sector, Financial Position, Comprehensive Income & Equity, Cash Flows --
    D01 total revenue lives on Financial Performance, by institution). staff_fte_url/staff_fte_raw_path
    point to the separate real Staff Appendix 1 workbook (sheets: Contents, A1.1-A1.18
    numbered tables, Explanatory notes -- C01 total staff FTE needs the right A1.x
    table identified, not yet done). acquire.py only reads url, so staff_fte_url is
    not wired up. This source needs splitting into two real sources (doe_finance_<year>,
    doe_staff_<year>) with their own parser configs once someone maps the exact sheet/row
    for each metric, then benchmark.py/normalise.py need to merge C01 from one with
    D01/D03 from the other onto the same institution row. Both real files downloaded
    and opened 29-30 Aug 2026 to confirm this -- sheet names above are real, not guessed.'
  parser: doe_staff_finance
  metric_ids:
  - C01
  - D01
  - D03
