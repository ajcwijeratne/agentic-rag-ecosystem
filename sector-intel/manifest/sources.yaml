- key: qilt_ses_2022
  publisher: QILT
  release_year: 2022
  url: https://www.qilt.edu.au/docs/default-source/default-document-library/ses_2022_report_tables.zip?sfvrsn=5b058ac1_1
  source_page: https://www.qilt.edu.au/resources?survey=SES&type=Reports
  raw_path: data/raw/qilt/ses_2022_extracted/SES_2022_National_Tables_Public.xlsx
  retrieved_date: '2026-08-30'
  verified: true
  note: 'Remapped to the real FOCUS_UG_UNI_1Y_INST_CI sheet (institution-level, undergraduate,
    university sector, current year, with confidence intervals). B01 = ''Quality of
    entire educational experience'', B02 = ''Teaching Quality'' (2022) / ''Teaching
    Quality and Engagement'' (2023+, QILT merged the Teaching Quality and Engagement
    scales in the 2023 SES redesign -- same concept, different scale definition, matched
    by header text not column position), B04 = ''Student Support'' (2022) / ''Student
    Support and Services'' (2023+, same redesign). Values are parsed from strings
    like ''84.1 (83.6, 84.6)'' -- the point estimate before the confidence interval.
    B06 (graduate employment) removed: it is a Graduate Outcomes Survey metric, not
    SES, and no GOS source is configured yet. openpyxl''s read_only mode cannot read
    these sheets at all -- QILT''s export leaves the <dimension> tag stuck at ''A1''
    even though real data runs 40+ rows, so parse.py reads the worksheet XML directly
    for this parser. Confirmed against the real files 29-30 Aug 2026.'
  parser: qilt_ses
  metric_ids:
  - B01
  - B02
  - B04
