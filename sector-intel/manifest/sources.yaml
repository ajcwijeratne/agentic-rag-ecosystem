- key: qilt_ses_2022
  publisher: QILT
  release_year: 2022
  url: https://www.qilt.edu.au/docs/default-source/default-document-library/ses_2022_report_tables.zip?sfvrsn=5b058ac1_1
  source_page: https://www.qilt.edu.au/resources?survey=SES&type=Reports
  raw_path: data/raw/qilt/ses_2022_extracted/SES_2022_National_Tables_Public.xlsx
  retrieved_date: '2026-08-30'
  verified: true
  note: 'Real file downloaded and unzipped 29-30 Aug 2026 (154 sheets). Same fixture-era
    mismatch as the 2024 entry: sheet STMT_SES_ALL_1Y does not exist. Real institution-level
    sheets are the FOCUS_*_INST_* family (e.g. FOCUS_UG_UNI_1Y_INST_CI); B06 graduate
    employment still does not belong here -- that is a Graduate Outcomes Survey (GOS)
    metric, not SES. Needs the same parser remap as qilt_ses_2024.'
  parser: qilt_ses
  metric_ids:
  - B01
  - B02
  - B04
  - B06
