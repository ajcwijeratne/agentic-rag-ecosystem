  raw_path: data/raw/doe/doe_finance_2022.xlsx
  retrieved_date: '2026-08-30'
  verified: true
  note: Real DoE Finance Tables workbook, sheet 'Financial Performance' (institutions
    as columns, not rows -- header row holds institution names, line-item rows hold
    revenue categories). D01 = 'Total Revenues from Continuing Operations' row, converted
    from $'000 to $m. D03 = 'International Students' / 'Fee Paying Overseas Students'
    row (label wording changes by year) as a share of D01. Confirmed against the real
    file 29-30 Aug 2026.
  parser: doe_finance
  metric_ids:
  - D01
  - D03
