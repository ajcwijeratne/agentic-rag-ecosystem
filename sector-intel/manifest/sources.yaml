sources:
- key: doe_student_allstudents_2022
  publisher: DoE
  release_year: 2022
  url: https://www.education.gov.au/download/17789/2022-section-2-all-students/35977/document/xlsx
  source_page: https://www.education.gov.au/higher-education-statistics/student-data
  raw_path: data/raw/doe/doe_student_allstudents_2022.xlsx
  retrieved_date: '2026-08-30'
  verified: true
  parser: doe_students
  metric_ids:
  - A01
  - A04
  - A05
  note: 'Institution-level figures for A01/A04/A05 come from Table 2.5 (Broad Level
    of Course, TOTAL column), Table 2.7 (Mode of Attendance: External / (Internal+External+Multi-modal)),
    and the Citizenship table (Total minus domestic categories minus Not provided,
    to survive the overseas-column wording changing every year). Table 2.1 (the fixture-era
    ''sheet'') has no institution rows at all -- it''s an age-group breakdown. A02
    (EFTSL), A03 (commencing students) and A06 (attrition) are NOT available in this
    workbook: DoE publishes those in separate Section-2/3 Load and a wholly separate
    Attrition, Success and Retention workbook, neither of which is acquired yet. Left
    out of metric_ids rather than guessed at.'
