  retrieved_date: '2026-08-16'
  verified: true
  note: 'Real file downloaded and unzipped 16 Aug 2026 (165 sheets). parser.py sheet/column
    config for qilt_ses is still fixture-era guesswork (sheet STMT_SES_ALL_1Y does
    not exist in the real file) and metric B06 graduate employment does not belong
    here at all -- that is a Graduate Outcomes Survey (GOS) metric, not SES. Needs
    a proper remap: institution-level figures live in the QOE_*_INST_FIG family for
    overall experience; teaching quality, student support, and peer engagement are
    not published as single-year by-institution sheets in this file, only as multi-year
    trend tables by student group/stage.'
  parser: qilt_ses
  metric_ids:
  - B01
  - B02
  - B04
  - B06
